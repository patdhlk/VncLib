name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    permissions:
      id-token: write   # request the OIDC token for NuGet trusted publishing
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for SourceLink

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Extract version from tag
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        echo "VERSION=$version" >> $env:GITHUB_ENV

    - name: Build
      run: dotnet build VncLib.sln -c Release

    - name: Pack NuGet packages
      run: dotnet pack VncLib.sln -c Release -o artifacts -p:Version=${{ env.VERSION }}

    - name: Login to NuGet (OIDC trusted publishing)
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Push to NuGet
      shell: pwsh
      run: |
        Get-ChildItem artifacts/*.nupkg | ForEach-Object {
          dotnet nuget push $_.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        }
